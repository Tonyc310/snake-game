name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: pipx run clang-format==23.1.2 --dry-run --Werror core/*.[ch] terminal/*.[ch] tests/*.c

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install ncurses and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev clang

      - name: Build with sanitizers
        run: |
          cmake -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
