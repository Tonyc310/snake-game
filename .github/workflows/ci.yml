name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: >-
          pipx run clang-format==23.1.2 --dry-run --Werror
          core/*.[ch] terminal/*.[ch] desktop/*.[ch] stm32/*.[ch] tests/*.c

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install ncurses and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev clang

      # The desktop front end is skipped here (no SDL3 package); the platforms job builds it.
      - name: Build with sanitizers
        run: |
          cmake -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  stm32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build the firmware
        run: |
          cmake --preset stm32
          cmake --build --preset stm32

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # SDL's configure stops if any of these X11 extensions is missing.
      - name: Install ncurses and SDL3's X11 headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev libx11-dev libxext-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev

      # Homebrew's SDL3 here, a source build elsewhere: CI covers both ways of finding it.
      - name: Install SDL3
        if: runner.os == 'macOS'
        run: brew install sdl3

      - name: Build
        run: |
          cmake -B build -DSNAKE_FETCH_SDL3=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
